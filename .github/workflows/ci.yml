name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Lint, Typecheck & Pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install backend dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -e "backend[dev]"

      - name: Lint backend with ruff
        working-directory: backend
        run: ruff check .

      - name: Lint scripts with ruff
        run: ruff check --config backend/pyproject.toml scripts

      - name: Typecheck backend with mypy
        working-directory: backend
        run: mypy .

      - name: Typecheck scripts with mypy
        run: mypy --config-file backend/pyproject.toml scripts

      - name: Run offline deterministic pytest suite
        working-directory: backend
        run: pytest -v

  frontend:
    name: Frontend (Typecheck & Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Typecheck frontend
        run: npm --prefix frontend run typecheck

      - name: Build frontend production bundle
        run: npm --prefix frontend run build

  docker-compose:
    name: Docker Compose Config Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml schema and interpolation
        run: docker compose config --quiet
