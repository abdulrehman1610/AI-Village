<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Village</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="hud-brand">
          <span class="hud-title">AI Village</span>
          <span id="ws-status" class="status-pill connecting">Connecting...</span>
        </div>
        <div class="hud-clock">
          <span id="sim-time">Day 1 · 07:00</span>
          <span id="sim-tick">Tick 0</span>
          <div
            id="time-controls"
            class="time-controls"
            aria-label="Simulation playback controls"
          ></div>
        </div>
        <nav class="hud-tools" aria-label="Village views">
          <button
            id="btn-relationships"
            type="button"
            class="sim-btn hud-tool-btn"
            aria-pressed="false"
          >
            Relationships
          </button>
          <button
            id="btn-metrics"
            type="button"
            class="sim-btn hud-tool-btn"
            aria-pressed="false"
          >
            Metrics
          </button>
          <button
            id="btn-replay"
            type="button"
            class="sim-btn hud-tool-btn"
            aria-pressed="false"
          >
            Replay
          </button>
        </nav>
        <div id="agents-bar" aria-label="Active agents"></div>
      </header>
      <main id="stage">
        <aside
          id="agent-inspector"
          class="agent-inspector hidden"
          aria-label="Agent inspector"
        ></aside>
        <div id="game-container"></div>
        <aside id="activity-feed" aria-label="Live village activity"></aside>
        <section
          id="relationship-panel"
          class="drawer-panel hidden"
          aria-label="Relationship network"
        ></section>
        <section
          id="metrics-panel"
          class="drawer-panel hidden"
          aria-label="Cost and token dashboard"
        ></section>
      </main>
      <section id="god-mode-bar" aria-label="God-mode event injection">
        <form id="event-form">
          <label class="god-mode-label" for="event-location">God Mode</label>
          <select id="event-location" aria-label="Target location">
            <option value="">All Village</option>
          </select>
          <input
            id="event-text"
            type="text"
            maxlength="500"
            placeholder="Inject a village event (e.g. A fire starts at the Bakery)..."
            required
          />
          <button id="event-submit" type="submit">Inject Event</button>
          <span
            id="event-feedback"
            class="feedback"
            role="status"
            aria-live="polite"
          ></span>
        </form>
      </section>
      <section
        id="replay-bar"
        class="replay-bar hidden"
        aria-label="Day replay controls"
      ></section>
      <footer id="controls-hint">
        Click agent to inspect · Drag to pan · Scroll to zoom · Press C for collision grid
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
